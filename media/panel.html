<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src {{cspSource}}; style-src {{cspSource}}; font-src {{cspSource}}; script-src 'nonce-{{nonce}}';">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Yield</title>
<link rel="stylesheet" href="{{styleUri}}">
</head>
<body>
<!-- The card's state classes are painted by the extension (cardClass) so the
     first frame is already correct, then kept in sync over postMessage. -->
<div class="{{cardClass}}" id="card">

  <div class="cardtop">
    <div class="statuschip" id="status" role="status" aria-live="polite">
      <span class="sdot"></span><span id="statusLabel">{{statusLabel}}</span>
    </div>
    <button class="iconbtn" id="openbtn" type="button" title="open yield-context.md" aria-label="open yield-context.md"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"/><path d="M14 2v4a2 2 0 0 0 2 2h4"/><path d="M10 9H8"/><path d="M16 13H8"/><path d="M16 17H8"/></svg></button>
    <!-- Persistent brand, optically centred regardless of the status chip's
         width. INLINE, not an <img>: an external asset here depends on the
         extension substituting a URI, which silently yields a broken image
         whenever the host is running older code than this file. Inline markup
         is read straight from disk with the rest of the page and cannot fail
         that way. Gradient ids are yw-* so they collide with nothing. -->
    <svg class="brand" viewBox="0 0 318 86" fill="none" role="img" aria-label="Yield" xmlns="http://www.w3.org/2000/svg"><path d="M32.0633 2.5H1.51261C1.02444 2.5 0.780358 2.5 0.628704 2.65165C0.477051 2.80331 0.477051 3.04739 0.477051 3.53555V48.5822C0.477051 49.0703 0.477051 49.3144 0.628704 49.4661C0.780358 49.6177 1.02444 49.6177 1.51261 49.6177H30.7887C31.77 49.6177 32.2607 49.6177 32.5677 49.9462C32.8747 50.2747 32.8432 50.7395 32.7802 51.669C31.5418 69.9471 11.2609 78.7691 1.77149 83.0143C53.8081 87.6743 74.7781 57.6433 74.7781 42.3688V3.53555C74.7781 3.04739 74.7781 2.80331 74.6264 2.65165C74.4748 2.5 74.2307 2.5 73.7425 2.5H44.9075C44.468 2.5 44.2482 2.5 44.1028 2.62457C43.9574 2.74913 43.9222 2.97618 43.8517 3.43028L43.8516 3.43033C42.8583 9.82781 38.4293 14.7186 34.9449 16.9568C34.1733 17.4524 33.7874 17.7002 33.5009 17.4909C33.2142 17.2816 33.3473 16.785 33.6133 15.7918C34.7985 11.3668 34.0653 6.91154 33.0507 3.24453V3.24451C32.9524 2.88913 32.9032 2.71144 32.7643 2.60572C32.6254 2.5 32.438 2.5 32.0633 2.5Z" fill="url(#yw-a)" stroke="url(#yw-b)" stroke-width="0.90611"/><path d="M123.796 71V47.8L106.356 14.2H114.196L127.156 40.76L140.116 14.2H147.956L130.676 47.8V71H123.796ZM168.165 71V28.6H174.885V71H168.165ZM151.125 71V65.08H189.525V71H151.125ZM151.925 34.52V28.6H174.885V34.52H151.925ZM167.525 21.96V14.12H174.565V21.96H167.525ZM211.014 71.96C207.014 71.96 203.547 71.0533 200.614 69.24C197.734 67.4267 195.494 64.8667 193.894 61.56C192.347 58.2 191.574 54.28 191.574 49.8C191.574 45.32 192.347 41.4267 193.894 38.12C195.494 34.8133 197.707 32.2533 200.534 30.44C203.414 28.5733 206.8 27.64 210.694 27.64C214.374 27.64 217.627 28.52 220.454 30.28C223.28 31.9867 225.494 34.4933 227.094 37.8C228.694 41.1067 229.494 45.1333 229.494 49.88V51.88H198.614C198.88 56.4133 200.08 59.8267 202.214 62.12C204.4 64.4133 207.334 65.56 211.014 65.56C213.787 65.56 216.054 64.92 217.814 63.64C219.627 62.3067 220.88 60.5733 221.574 58.44L228.774 59C227.654 62.7867 225.52 65.9067 222.374 68.36C219.28 70.76 215.494 71.96 211.014 71.96ZM198.614 45.96H222.134C221.814 41.8533 220.614 38.84 218.534 36.92C216.454 35 213.84 34.04 210.694 34.04C207.44 34.04 204.747 35.0533 202.614 37.08C200.534 39.0533 199.2 42.0133 198.614 45.96ZM249.702 71V25.56C249.702 23.8533 249.222 22.52 248.262 21.56C247.302 20.6 245.969 20.12 244.262 20.12H234.262V14.2H244.582C248.476 14.2 251.409 15.2133 253.382 17.24C255.409 19.2133 256.422 22.1467 256.422 26.04V71H249.702ZM232.662 71V65.08H271.062V71H232.662ZM290.791 71.96C287.058 71.96 283.831 71.0533 281.111 69.24C278.391 67.4267 276.285 64.8667 274.791 61.56C273.351 58.2533 272.631 54.3333 272.631 49.8C272.631 45.2667 273.351 41.3467 274.791 38.04C276.285 34.7333 278.391 32.1733 281.111 30.36C283.831 28.5467 287.058 27.64 290.791 27.64C293.778 27.64 296.391 28.36 298.631 29.8C300.871 31.1867 302.498 32.76 303.511 34.52V14.2H310.231V71H304.151L303.911 64.6C302.738 66.8933 301.005 68.7067 298.711 70.04C296.418 71.32 293.778 71.96 290.791 71.96ZM291.191 65.56C293.751 65.56 295.938 64.92 297.751 63.64C299.618 62.36 301.031 60.5467 301.991 58.2C303.005 55.8 303.511 53 303.511 49.8C303.511 46.4933 303.005 43.6667 301.991 41.32C301.031 38.9733 299.618 37.1867 297.751 35.96C295.885 34.68 293.645 34.04 291.031 34.04C287.565 34.04 284.791 35.4533 282.711 38.28C280.685 41.0533 279.671 44.8933 279.671 49.8C279.671 54.6533 280.685 58.4933 282.711 61.32C284.791 64.1467 287.618 65.56 291.191 65.56Z" fill="url(#yw-c)"/><defs><linearGradient id="yw-a" x1="37.6276" y1="11.0263" x2="37.6276" y2="77.1053" gradientUnits="userSpaceOnUse"><stop stop-color="#10151C"/><stop offset="1" stop-color="#484A4C"/></linearGradient><linearGradient id="yw-b" x1="37.6276" y1="26.125" x2="37.6276" y2="71.6875" gradientUnits="userSpaceOnUse"><stop stop-color="#1F2937"/><stop offset="1" stop-color="#6B7280"/></linearGradient><linearGradient id="yw-c" x1="210.278" y1="9.05263" x2="210.278" y2="79.2105" gradientUnits="userSpaceOnUse"><stop stop-color="#10151C"/><stop offset="1" stop-color="#484A4C"/></linearGradient></defs></svg>
  </div>

  <div class="chat">
    <!-- ONE scrollable column. The header is the FIRST ITEM in it, not fixed
         chrome above it: it scrolls away as messages accumulate and comes back
         when you scroll up. Nothing is capped and nothing leaves the stack. -->
    <div class="streamwrap">
    <div class="stream" id="stream"><div class="inner" id="inner">
      <div class="centre">
        <div class="markwrap"><img class="mark" src="{{logoUri}}" alt="Yield"></div>
        <div class="greet">
          <div class="h1">Every wait can <span class="ydplain">yield</span> something</div>
          <div class="h2">Feed your agent, sharpen its output</div>
          <p>Everything you add is saved to <span class="m">yield-context.md</span> and read before every response, so your agent always has your context on hand.</p>
        </div>
      </div>
    </div></div>
    <!-- One line, only for a state the user has to act on. Silent otherwise. -->
    <div class="setupnote" id="setupnote" hidden></div>
    <!-- Appears only when a message arrives while you are reading history, so a
         new message never yanks the view down. -->
    <button class="newmsg" id="newmsg" type="button" hidden>New message<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><polyline points="19 12 12 19 5 12"/></svg></button>
    </div>

    <!-- filled from the extension: never more than 2, one line each -->
    <div class="qopts" id="qopts"></div>

    <div class="composer">
      <textarea id="input" placeholder="Add context in as much detail as you like.
The richer it is, the better its replies."></textarea>
      <div class="cbtns">
        <button class="micbtn" id="micbtn" type="button" disabled title="Checking voice support…" aria-label="Speak instead"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" x2="12" y1="19" y2="22"/></svg></button>
        <button class="sendbtn" id="sendbtn" type="button" disabled title="Send" aria-label="Send"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="19" x2="12" y2="5"/><polyline points="5 12 12 5 19 12"/></svg></button>
      </div>

      <!-- v78 voice states. All three live INSIDE the composer, absolutely
           positioned over it, so entering a voice state never resizes or
           shifts anything below. Bars are built by panel.js. -->
      <div class="voicebar" id="voicebar">
        <span class="vstate" id="vstate">0:00</span>
        <div class="wave" id="wave"></div>
        <button class="vstop" id="vstop" type="button" title="Stop recording" aria-label="Stop recording"><svg viewBox="0 0 24 24" fill="currentColor" stroke="none"><rect x="6" y="6" width="12" height="12" rx="2.5"/></svg></button>
      </div>

      <div class="cnotice" id="cnotice">
        <span class="nt" id="noticetext"></span>
        <button class="retry" id="retrybtn" type="button" style="display:none">Retry</button>
      </div>
      <div class="cprog" id="cprog"></div>
    </div>

    <div class="chatfoot">
      <button class="ctxbtn" id="ctxbtn" type="button" title="open yield-context.md"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"/><path d="M14 2v4a2 2 0 0 0 2 2h4"/><path d="M10 9H8"/><path d="M16 13H8"/><path d="M16 17H8"/></svg><span id="ctxlabel">{{footerLabel}}</span></button>
    </div>
  </div>

</div>

<!-- one question row; cloned per question so the icon markup lives in one place -->
<template id="qopt-tpl">
  <button class="qopt" type="button"><span class="qret"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 10 4 15 9 20"/><path d="M20 4v7a4 4 0 0 1-4 4H4"/></svg></span><span class="qt"></span></button>
</template>

<script nonce="{{nonce}}" src="{{wavUri}}"></script>
<script nonce="{{nonce}}" src="{{scriptUri}}"></script>
</body>
</html>
